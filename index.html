  <style>
    :root {
      --green: #00ff41;
      --green-dim: #00aa2a;
      --pink: #ff0055;
      --cyan: #00ffff;
      --yellow: #ffcc00;
      --bg: #000;
      --panel: rgba(0, 10, 2, 0.9);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
      color: var(--green);
      min-height: 100svh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* Scanlines + Vignette */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,255,65,0.035) 2px 4px);
      pointer-events: none; z-index: 90;
    }
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.9) 100%);
      pointer-events: none; z-index: 89;
    }
    #rain { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; opacity: .5; transition: opacity .6s; }
    body.matrix #rain { opacity: .85; }

    /* ---------- Startbildschirm (ein Tipp schaltet Ton, Video, Sensor frei) ---------- */
    #gate {
      position: fixed; inset: 0; z-index: 82;
      background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6rem;
      padding: 24px 16px; text-align: center;
    }
    #gate.gone { animation: crtOff .4s ease-in forwards; pointer-events: none; }
    #gate .brand { font-size: .72rem; letter-spacing: .3em; color: var(--green-dim); }
    #gate .warn-txt { font-size: clamp(.8rem, 3.4vw, 1rem); letter-spacing: .14em; color: var(--pink); text-shadow: 0 0 10px var(--pink); }
    #go {
      font: inherit; font-size: clamp(1rem, 5vw, 1.35rem); font-weight: 800; letter-spacing: .16em;
      color: #000; background: var(--green);
      border: 0; border-radius: 6px;
      padding: 1.05rem 1.8rem; min-height: 56px; cursor: pointer;
      box-shadow: 0 0 0 2px var(--green), 0 0 30px var(--green), 0 0 70px rgba(0,255,65,.4);
      animation: goPulse 1.4s ease-in-out infinite;
    }
    #go:focus-visible { outline: 3px solid var(--cyan); outline-offset: 4px; }
    @keyframes goPulse { 50% { box-shadow: 0 0 0 2px var(--green), 0 0 50px var(--green), 0 0 110px rgba(0,255,65,.6); transform: scale(1.03); } }
    #gate .seg { box-shadow: none; }
    #gate .snd-note { font-size: .66rem; letter-spacing: .14em; color: rgba(0,255,65,.5); }

    /* ---------- Boot-Sequenz ---------- */
    #boot {
      position: fixed; inset: 0; z-index: 80;
      background: #000;
      display: flex; flex-direction: column; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 16px 24px;
      cursor: pointer;
    }
    #boot[hidden] { display: none; }
    #boot.gone { animation: crtOff .45s ease-in forwards; pointer-events: none; }
    @keyframes crtOff {
      0%   { transform: scale(1, 1); filter: brightness(1); }
      60%  { transform: scale(1, .004); filter: brightness(4); background: #fff; }
      100% { transform: scale(0, .004); filter: brightness(8); opacity: 0; }
    }
    #bootlog {
      width: min(620px, 100%); margin: 0 auto;
      font: inherit; font-size: clamp(0.72rem, 3vw, 0.9rem); line-height: 1.7;
      white-space: pre-wrap; overflow-wrap: anywhere;
      text-shadow: 0 0 6px rgba(0,255,65,.6);
    }
    #bootlog .r { color: var(--pink); text-shadow: 0 0 8px var(--pink); }
    #bootlog .big {
      display: block; margin-top: .6em;
      font-size: clamp(1.4rem, 7vw, 2.4rem); font-weight: 800; letter-spacing: .1em;
      animation: deny .25s steps(2) 3;
    }
    @keyframes deny { 50% { opacity: 0; } }
    .bootbar { width: min(620px, 100%); margin: 1rem auto 0; height: 6px; border: 1px solid var(--green-dim); }
    .bootbar i { display: block; height: 100%; width: 0; background: var(--green); box-shadow: 0 0 10px var(--green); transition: width .25s; }
    .skip { position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: .68rem; letter-spacing: .2em; color: var(--green-dim); opacity: .7; }

    /* ---------- Bedienleiste oben ---------- */
    .topbar {
      position: fixed; z-index: 70;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    .topbar > * { pointer-events: auto; }
    .seg {
      display: flex;
      border: 1px solid var(--green);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 14px rgba(0,255,65,0.25);
      background: rgba(0,0,0,0.78);
    }
    .seg button {
      font: inherit; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em;
      color: var(--green-dim); background: transparent; border: 0;
      padding: 0.45rem 0.7rem; min-height: 34px; cursor: pointer;
      transition: background .2s, color .2s;
    }
    .seg button + button { border-left: 1px solid var(--green); }
    .seg button:hover { color: var(--green); }
    .seg button[aria-pressed="true"] { background: var(--green); color: #000; }
    .seg button:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }
    #snd { display: flex; align-items: center; gap: .45rem; }
    #snd svg { width: 16px; height: 16px; flex: none; }

    /* ---------- Inhalt ---------- */
    main {
      position: relative; z-index: 10;
      min-height: 100svh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 4.6rem 16px 2rem;
      text-align: center;
    }
    body.on main { animation: crtOn .7s ease-out; }
    @keyframes crtOn {
      0%   { transform: scale(1, .004); filter: brightness(6) saturate(0); opacity: .6; }
      45%  { transform: scale(1, 1.02); filter: brightness(2.2); opacity: 1; }
      70%  { transform: scale(1, .99);  filter: brightness(1.2); }
      100% { transform: none; filter: none; }
    }

    .video-wrap {
      position: relative;
      width: min(300px, 64vw);
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      background: #1c1c1c;
      animation: ringPulse 2s ease-in-out infinite;
    }
    .video-wrap::after {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      box-shadow: inset 0 0 40px rgba(255,0,85,0.35); pointer-events: none;
    }
    @keyframes ringPulse {
      0%,100% { box-shadow: 0 0 0 3px var(--pink), 0 0 40px var(--pink), 0 0 80px rgba(255,0,85,0.3); }
      50%     { box-shadow: 0 0 0 3px var(--pink), 0 0 70px var(--pink), 0 0 140px rgba(255,0,85,0.5); }
    }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }

    .title {
      position: relative;
      font-size: clamp(1.6rem, 7vw, 3.2rem);
      font-weight: 800; letter-spacing: 0.12em; line-height: 1.15;
      margin-top: 1.5rem;
      color: var(--green);
      text-shadow: 0 0 10px var(--green), 0 0 30px rgba(0,255,65,0.4);
      animation: glitchT 3.2s infinite;
    }
    .title::before, .title::after {
      content: attr(data-text); position: absolute; inset: 0; opacity: 0; pointer-events: none;
    }
    .title::before { color: var(--pink); animation: slice 3.2s infinite; }
    .title::after  { color: var(--cyan); animation: slice 3.2s infinite reverse; }
    @keyframes glitchT {
      0%,88%,100% { transform: none; }
      89% { transform: skew(-3deg) translateX(-2px); }
      91% { transform: skew(2deg) translateX(2px); }
      93% { transform: none; }
    }
    @keyframes slice {
      0%,88%,94%,100% { opacity: 0; clip-path: inset(0 0 0 0); transform: none; }
      89% { opacity: .8; clip-path: inset(10% 0 55% 0); transform: translateX(-4px); }
      91% { opacity: .8; clip-path: inset(60% 0 8% 0);  transform: translateX(4px); }
      93% { opacity: .6; clip-path: inset(35% 0 40% 0); transform: translateX(-2px); }
    }

    .insult {
      font-size: clamp(0.95rem, 3.6vw, 1.15rem); font-weight: 700;
      color: var(--pink); letter-spacing: 0.18em;
      text-shadow: 0 0 10px var(--pink);
      margin-top: 0.5rem; min-height: 1.6em;
      transition: opacity .3s, transform .3s;
    }
    .insult.out { opacity: 0; transform: translateY(-4px); }
    .blink { animation: bl 1s step-end infinite; }
    @keyframes bl { 50% { opacity: 0; } }

    /* ---------- Weglaufender Kauf-Knopf ---------- */
    .buy-slot { height: 52px; margin-top: 1.1rem; display: flex; align-items: center; justify-content: center; }
    #buy {
      font: inherit; font-size: .82rem; font-weight: 800; letter-spacing: .14em;
      color: #000; background: var(--pink);
      border: 0; border-radius: 4px;
      padding: .8rem 1.3rem; min-height: 44px;
      cursor: pointer; white-space: nowrap;
      box-shadow: 0 0 0 1px var(--pink), 0 0 24px rgba(255,0,85,.6);
      touch-action: none; user-select: none; -webkit-user-select: none;
      z-index: 75;
    }
    #buy.free { position: fixed; transition: left .22s cubic-bezier(.2,1.4,.4,1), top .22s cubic-bezier(.2,1.4,.4,1); }
    #buy.boom { animation: boom .5s ease-out forwards; pointer-events: none; }
    @keyframes boom {
      0%   { transform: scale(1); filter: none; }
      30%  { transform: scale(1.5) rotate(-6deg); filter: brightness(3); }
      100% { transform: scale(2.4) rotate(10deg); filter: blur(8px); opacity: 0; }
    }
    .shard {
      position: fixed; z-index: 76; width: 8px; height: 8px; pointer-events: none;
      background: var(--pink); box-shadow: 0 0 8px var(--pink);
      animation: shard .9s ease-out forwards;
    }
    @keyframes shard { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }

    /* ---------- Terminal ---------- */
    .terminal {
      margin-top: 1.2rem;
      width: min(560px, 100%);
      background: var(--panel);
      border: 1px solid var(--green);
      border-radius: 6px;
      box-shadow: 0 0 28px rgba(0,255,65,0.14), inset 0 0 30px rgba(0,255,65,0.04);
      text-align: left;
      overflow: hidden;
      cursor: text;
    }
    .bar {
      display: flex; align-items: center; gap: 6px;
      padding: 0.5rem 0.8rem;
      border-bottom: 1px solid rgba(0,255,65,0.35);
      background: rgba(0,255,65,0.06);
      font-size: 0.7rem; color: var(--green-dim);
    }
    .bar i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .bar i:nth-child(1) { background: var(--pink); }
    .bar i:nth-child(2) { background: var(--yellow); }
    .bar i:nth-child(3) { background: var(--green); }
    .bar span { margin-left: auto; letter-spacing: 0.08em; }
    .screen {
      padding: 0.9rem 1.1rem 1rem;
      min-height: 11.6rem;
      max-height: min(52vh, 420px);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin; scrollbar-color: var(--green-dim) transparent;
    }
    .tline {
      font-size: clamp(0.72rem, 2.9vw, 0.84rem);
      line-height: 1.75;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .ok   { color: var(--green); }
    .err  { color: var(--pink); }
    .warn { color: var(--yellow); }
    .cyan { color: var(--cyan); }
    .dim  { color: var(--green-dim); }
    .r { color: var(--pink); }
    .y { color: var(--yellow); }
    .c { color: var(--cyan); }
    .w { color: #eaffef; }
    .cursor {
      display: inline-block; width: 0.55em; height: 1em;
      background: var(--green); vertical-align: -0.15em; margin-left: 2px;
      animation: bl 1s step-end infinite;
    }
    .prompt { display: flex; align-items: baseline; gap: .5em; margin-top: .2rem; }
    .prompt[hidden] { display: none; }
    .prompt label { font-size: clamp(0.72rem, 2.9vw, 0.84rem); color: var(--cyan); white-space: nowrap; }
    .prompt input {
      flex: 1; min-width: 0;
      font: inherit; font-size: 16px; /* 16px: iPhone zoomt sonst rein */
      color: var(--green); background: transparent; border: 0; outline: 0;
      caret-color: var(--green);
      padding: .1rem 0;
    }
    .prompt input::placeholder { color: rgba(0,255,65,.35); }

    .ai-row {
      display: flex; flex-wrap: wrap; gap: 6px;
      align-items: center; justify-content: center;
      margin-top: 1rem;
      font-size: 0.7rem; color: var(--green-dim); letter-spacing: 0.1em;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: dp 1.2s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes dp { 0%,100% { transform: scale(1); opacity: .25; } 50% { transform: scale(1.7); opacity: 1; } }
    .hint { margin-top: .7rem; font-size: .66rem; letter-spacing: .12em; color: rgba(0,255,65,.5); }
    .hint b { color: var(--cyan); font-weight: 700; }

    footer { margin-top: 1.4rem; font-size: 0.65rem; letter-spacing: 0.2em; color: rgba(0,255,65,0.35); }

    /* ---------- Glitch-Anfall ---------- */
    #bars {
      position: fixed; inset: 0; z-index: 85; pointer-events: none; display: none;
      background:
        repeating-linear-gradient(0deg, transparent 0 18px, rgba(255,0,85,.22) 18px 22px, transparent 22px 47px, rgba(0,255,255,.18) 47px 50px);
      mix-blend-mode: screen;
    }
    body.glitch #bars { display: block; animation: barsMove .09s steps(2) infinite; }
    body.glitch main { animation: jitter .1s steps(2) infinite; filter: contrast(1.5) saturate(2.2) hue-rotate(25deg); }
    body.glitch .title { text-shadow: -6px 0 var(--pink), 6px 0 var(--cyan); }
    body.glitch.soft main { filter: none; }
    body.glitch.soft #bars { opacity: .5; }
    @keyframes barsMove { 0% { background-position: 0 0; } 100% { background-position: 0 37px; } }
    @keyframes jitter {
      0%   { transform: translate(4px, -2px) skewX(5deg); }
      50%  { transform: translate(-5px, 3px) skewX(-4deg); }
      100% { transform: translate(2px, 1px); }
    }

    /* ---------- Rechtsklick-Menü ---------- */
    #ctx {
      position: fixed; z-index: 86; min-width: 220px;
      background: rgba(0,8,2,.96); border: 1px solid var(--green); border-radius: 6px;
      box-shadow: 0 0 30px rgba(0,255,65,.3); padding: .35rem; display: none;
    }
    #ctx.open { display: block; animation: ctxIn .12s ease-out; }
    @keyframes ctxIn { from { transform: scale(.95); opacity: 0; } }
    #ctx button {
      display: block; width: 100%; text-align: left;
      font: inherit; font-size: .8rem; color: var(--green); background: transparent; border: 0;
      padding: .55rem .7rem; border-radius: 4px; cursor: pointer; letter-spacing: .04em;
    }
    #ctx button:hover, #ctx button:focus-visible { background: var(--green); color: #000; outline: 0; }
    #ctx hr { border: 0; border-top: 1px solid rgba(0,255,65,.25); margin: .3rem .2rem; }

    /* ---------- Bluescreen ---------- */
    #bsod {
      position: fixed; inset: 0; z-index: 95; background: #0078d7; color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;
      padding: max(9vh, env(safe-area-inset-top)) 8vw 6vh; overflow: hidden; cursor: none;
    }
    #bsod .sad { font-size: clamp(5rem, 22vw, 10rem); line-height: 1; margin-bottom: 1.6rem; font-weight: 300; }
    #bsod p { font-size: clamp(1.05rem, 4.2vw, 1.6rem); line-height: 1.45; max-width: 46rem; font-weight: 300; }
    #bsod .pct { margin-top: 1.6rem; }
    #bsod .foot { display: flex; gap: 1.2rem; align-items: center; margin-top: 2.4rem; font-size: clamp(.75rem, 2.8vw, .95rem); line-height: 1.5; }
    #bsod .qr {
      width: 92px; height: 92px; flex: none; background:
        repeating-conic-gradient(#fff 0 25%, #0078d7 0 50%) 0 0 / 23px 23px,
        #fff;
      outline: 6px solid #fff;
    }

    /* ---------- Selbstzerstörung ---------- */
    #cd {
      position: fixed; inset: 0; z-index: 87; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
      background-color: rgba(0,0,0,.72);
      background-image: radial-gradient(ellipse at center, rgba(255,0,85,.06) 30%, rgba(255,0,85,.5) 100%);
      animation: cdPulse 1s ease-in-out infinite;
    }
    @keyframes cdPulse { 50% { background-color: rgba(40,0,10,.8); } }
    #cd .lbl { font-size: clamp(.9rem, 4vw, 1.3rem); font-weight: 800; letter-spacing: .2em; color: #fff; text-shadow: 0 0 12px var(--pink); background: rgba(0,0,0,.6); padding: .3rem .8rem; }
    #cd .num { font-size: clamp(6rem, 34vw, 14rem); font-weight: 800; line-height: 1; color: var(--pink); text-shadow: 0 0 30px var(--pink), 0 0 80px var(--pink); }
    #cd .num.tick { animation: tick .3s ease-out; }
    @keyframes tick { from { transform: scale(1.35); } }
    #cd button {
      pointer-events: auto; font: inherit; font-weight: 800; letter-spacing: .14em; font-size: .9rem;
      color: #fff; background: #000; border: 2px solid #fff; border-radius: 4px; padding: .8rem 1.4rem; cursor: pointer;
    }
    body.crumble main { animation: crumble 1.1s cubic-bezier(.5,0,.9,.4) forwards; }
    @keyframes crumble {
      0%   { transform: none; filter: none; }
      15%  { transform: translate(-8px, 4px) rotate(-1deg); filter: brightness(2.5) contrast(2); }
      30%  { transform: translate(6px, -3px) rotate(1deg); }
      100% { transform: translateY(110vh) rotate(14deg) scale(.6); filter: blur(6px); opacity: 0; }
    }
    #flash { position: fixed; inset: 0; z-index: 96; background: #fff; pointer-events: none; animation: flash .6s ease-out forwards; }
    @keyframes flash { to { opacity: 0; } }

    /* ---------- Kamera-Scan ---------- */
    #cam { position: fixed; inset: 0; z-index: 88; background: #000; overflow: hidden; }
    #cam video {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      transform: scaleX(-1);
      filter: grayscale(1) sepia(1) hue-rotate(68deg) saturate(5) contrast(1.35) brightness(.95);
    }
    #cam .grid {
      position: absolute; inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(0,255,65,.12) 0 1px, transparent 1px 40px),
        repeating-linear-gradient(90deg, rgba(0,255,65,.12) 0 1px, transparent 1px 40px);
    }
    #cam .sweep { position: absolute; left: 0; right: 0; height: 3px; background: var(--green); box-shadow: 0 0 20px var(--green); animation: sweep 2.2s linear infinite; }
    @keyframes sweep { from { top: 0; } to { top: 100%; } }
    #cam .ret {
      position: absolute; left: 50%; top: 42%; width: min(62vmin, 340px); aspect-ratio: 1;
      transform: translate(-50%, -50%);
      animation: retLock 1.6s ease-out forwards, retPulse 1s 1.6s ease-in-out infinite;
    }
    #cam .ret i { position: absolute; width: 22%; height: 22%; border: 3px solid var(--green); box-shadow: 0 0 10px var(--green); }
    #cam .ret i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; }
    #cam .ret i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; }

let actx = null, soundOn = store.get('sound') !== '0';   // Standard: Ton AN
function audio() {
  if (!actx) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    actx = new C();
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f, d = .06, type = 'square', vol = .04, slide) {
  if (!soundOn || !actx) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d = .25, vol = .1, freq = 1200, toFreq) {
  if (!soundOn || !actx) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime, len = Math.floor(a.sampleRate * d);
  const buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), flt = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; flt.type = 'bandpass'; flt.Q.value = 1.2;
  flt.frequency.setValueAtTime(freq, t);
  if (toFreq) flt.frequency.exponentialRampToValueAtTime(toFreq, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  src.connect(flt).connect(g).connect(a.destination); src.start(t);
}

const canSpeak = 'speechSynthesis' in window;
let voices = [];
if (canSpeak) {
  const load = () => { voices = speechSynthesis.getVoices(); };

// Nur eine Stimme nehmen, die die Sprache wirklich spricht – sonst lieber schweigen
// (vorher hat z. B. eine deutsche Stimme Türkisch vorgelesen und das klang furchtbar)
const VOICE_BEST = { tr: /yelda|emel|ahmet|filiz|cem|tolga/i, de: /conrad|killian|florian|katja|amala|markus|yannick|anna|petra|helena/i, en: /ryan|thomas|arthur|daniel|oliver|guy|davis|aaron/i };
const VOICE_JUNK = /bad news|bahh|bells|boing|bubbles|cellos|wobble|good news|jester|organ|superstar|trinoids|whisper|zarvox|albert|fred|junior|ralph|kathy|grandma|grandpa|rocko|eddy|flo\b|reed|sandy|shelley/i;
function voiceFor(l) {
  if (!voices.length) voices = speechSynthesis.getVoices();
  let best = null, bestScore = -1;
  for (const v of voices) {
    if (v.lang.replace('_', '-').toLowerCase().split('-')[0] !== l || VOICE_JUNK.test(v.name)) continue;
    let s = 0;
    if (/natural|neural|online|premium|enhanced|erweitert|gelişmiş/i.test(v.name)) s += 4;
    if (VOICE_BEST[l].test(v.name)) s += 2;
    if (/google/i.test(v.name)) s += 1;
    if (s > bestScore) { best = v; bestScore = s; }
  }
  return best;
}
function speak(text) {
  if (!soundOn || !canSpeak || !text) return;
  try {
    const v = voiceFor(lang);
    if (!v) return;
    const u = new SpeechSynthesisUtterance(strip(text).replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu, ''));
    u.voice = v; u.lang = v.lang;
    u.pitch = .8; u.rate = .95; u.volume = 1;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) {}
}

function spawnShards(cx, cy, n = 26, spread = 220) {

const cv = $('#rain'), ctx = cv.getContext('2d');
const CHARS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜĞŞİÇ$#%&*+<>/\\=';
const FS = 16;
let W = 0, H = 0, cols = [];
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const n = Math.ceil(W / FS);
  cols = Array.from({ length: n }, (_, i) => cols[i] ?? Math.random() * -H / FS);
}
resize(); addEventListener('resize', resize);
let last = 0;
function rain(ts) {
  requestAnimationFrame(rain);
  if (ts - last < 50) return;   // ~20 Bilder/s reichen und schonen den Akku (im Hintergrund pausiert der Browser ohnehin)
  last = ts;
  const matrix = document.body.classList.contains('matrix');
  ctx.fillStyle = 'rgba(0,0,0,0.07)'; ctx.fillRect(0, 0, W, H);
  ctx.font = '700 ' + FS + 'px "JetBrains Mono", monospace';
  for (let i = 0; i < cols.length; i++) {
    const y = cols[i] * FS;
    const ch = CHARS[Math.floor(Math.random() * CHARS.length)];
    const r = Math.random();
    ctx.fillStyle = rainColor(r, matrix);
    ctx.fillText(ch, i * FS, y);
    if (y > H && Math.random() > (matrix ? .9 : .975)) cols[i] = 0;
    cols[i] += matrix ? 1 : .55;
  }
}
if (reduce) {
  ctx.font = '700 ' + FS + 'px monospace'; ctx.fillStyle = 'rgba(0,255,65,.4)';
  for (let i = 0; i < 400; i++) ctx.fillText(CHARS[i % CHARS.length], Math.random() * W, Math.random() * H);
} else requestAnimationFrame(rain);

function deviceName() {
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua)) return 'iPhone';
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'iPad';
  if (/Android/.test(ua)) {
    const m = ua.match(/Android [\d.]+; ([^;)]+)/);
    const model = m && m[1].trim();
    return 'Android' + (model && model !== 'K' ? ' · ' + model : '');
  }
  if (/Windows/.test(ua)) return 'Windows-PC';
  if (/Mac/.test(ua)) return 'Mac';
  if (/CrOS/.test(ua)) return 'Chromebook';
  if (/Linux/.test(ua)) return 'Linux';
  return '???';
}
function browserName() {
  const ua = navigator.userAgent;
  if (navigator.brave) return 'Brave';
  if (/Edg(e|A|iOS)?\//.test(ua)) return 'Edge';
  if (/OPR\/|Opera/.test(ua)) return 'Opera';
  if (/SamsungBrowser/.test(ua)) return 'Samsung Internet';
  if (/Firefox|FxiOS/.test(ua)) return 'Firefox';
  if (/CriOS|Chrome/.test(ua)) return 'Chrome';
  if (/Safari/.test(ua)) return 'Safari';
  return '???';
}
const DEVICE = deviceName(), BROWSER = browserName();
let battery = null;
const batteryReady = (navigator.getBattery
  ? Promise.race([navigator.getBattery().then(b => { battery = b; }).catch(() => {}), sleep(900)])
  : Promise.resolve());

function scanLines() {
  const s = T.scan, tag = '<span class="c">' + s.tag + '</span> ';
  const now = new Date(), h = now.getHours();
  const time = now.toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' });
  let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
  const L = [];
  if (NAME) L.push(['err', tag + s.target + ': <span class="r">' + esc(up(NAME)) + '</span> · <span class="w">' + s.identified + ' ✔</span>']);
  L.push(
    ['cyan', tag + s.device + ': <span class="w">' + esc(DEVICE) + '</span> · ' + s.browser + ': <span class="w">' + esc(BROWSER) + '</span>'],
    ['cyan', tag + s.time + ': <span class="w">' + time + '</span>' + (tz ? ' <span class="dim">(' + esc(tz) + ')</span>' : '')],
    ['cyan', tag + s.screen + ': <span class="w">' + screen.width + '×' + screen.height + '</span> · ' + s.lang + ': <span class="w">' + esc(navigator.language || '?') + '</span>']
  );
  if (battery) {
    L.push(['cyan', tag + s.battery + ': <span class="' + (battery.level < .2 ? 'r' : 'w') + '">' + Math.round(battery.level * 100) + ' %</span>' + (battery.charging ? ' (' + s.charging + ')' : '')]);
  }
  const dt = T.daytime, key = h < 5 ? 'night' : h < 11 ? 'morning' : h < 18 ? 'day' : 'evening';
  L.push(['warn', '<span class="y">[' + { de: 'KI', tr: 'YZ', en: 'AI' }[lang] + ']</span> ' + fill(dt[key], { t: time })]);
  L.push(['cyan', s.done], ['cyan', s.bye], ['dim', s.tip]);
  return L;
}

const out = $('#out'), screenEl = $('#screen'), promptEl = $('#prompt'), cmdEl = $('#cmd');
const cursor = document.createElement('span'); cursor.className = 'cursor';
let runId = 0, busy = null;
const toBottom = () => { screenEl.scrollTop = screenEl.scrollHeight; };

function addLine(cls, html) {
  const d = document.createElement('div');
  d.className = 'tline ' + (cls || 'ok');
  d.innerHTML = html;
  out.appendChild(d); toBottom();
  return d;
}
async function typeLine(cls, html, id, speed = 1) {
  const d = addLine(cls, '');
  if (reduce) { d.innerHTML = html; return id === runId; }
  const tokens = html.match(/<[^>]+>|&[a-z#0-9]+;|[\s\S]/gu) || [];
  let built = '', n = 0;
  for (let i = 0; i < tokens.length; i++) {
    if (id !== runId) return false;
    built += tokens[i];
    if (tokens[i][0] === '<') continue;
    d.innerHTML = built; d.appendChild(cursor); toBottom();
    if (++n % 2 === 0) sfx.key();
    await sleep((12 + Math.random() * 20) / speed);
  }
  d.innerHTML = built;
  return id === runId;
}
async function runIntro() {
  const id = ++runId;
  out.innerHTML = ''; promptEl.hidden = true;
  await sleep(350);
  for (const [cls, html] of T.lines) {
    if (!await typeLine(cls, html, id)) return;
    await sleep(200);
  }
  await batteryReady;
  const scan = scanLines();
  for (let i = 0; i < scan.length; i++) {
    if (id !== runId) return;
    if (!await typeLine(scan[i][0], scan[i][1], id, 1.6)) return;
    if (scan[i][1] === T.scan.bye) speak(fill(T.voice.bye, { n: nameVoice() }));
    await sleep(140);
  }
  if (id !== runId) return;
  sfx.beep();
  promptEl.hidden = false;
  cmdEl.placeholder = T.placeholder;
  toBottom();
}

const buy = $('#buy'), slot = buy.parentElement;
let flees = 0, attempts = 0, lastFlee = 0, buyDead = false;
const MAX_FLEES = 7;

function fleeFrom(px, py) {
  if (buyDead) return;
  const now = performance.now();
  if (now - lastFlee < 120) return;
  lastFlee = now;
  const r = buy.getBoundingClientRect();
  if (!buy.classList.contains('free')) {
    buy.style.left = r.left + 'px'; buy.style.top = r.top + 'px';
    buy.classList.add('free');
    slot.style.width = r.width + 'px';
    void buy.offsetWidth;
  }
  flees++;
  if (flees >= MAX_FLEES) { explode(); return; }
  buy.textContent = T.buy[flees % T.buy.length];
  const bw = buy.offsetWidth, bh = buy.offsetHeight, m = 16, topMin = 70;
  let x, y, tries = 0;
  do {
    x = m + Math.random() * Math.max(1, innerWidth - bw - 2 * m);
    y = topMin + Math.random() * Math.max(1, innerHeight - bh - topMin - m);
    tries++;
  } while (tries < 20 && Math.hypot(x + bw / 2 - px, y + bh / 2 - py) < Math.min(260, innerWidth * .45));
  buy.style.left = x + 'px'; buy.style.top = y + 'px';
  sfx.whoosh(); buzz(15);
}
function resetBuy() {
  buy.classList.remove('free', 'boom');
  buy.style.left = buy.style.top = ''; slot.style.width = '';
  flees = 0; buyDead = false; buy.textContent = T.buy[0];
}
function explode() {
  buyDead = true; attempts++; unlock('buyer');
  const r = buy.getBoundingClientRect();
  buy.classList.add('boom'); sfx.boom(); glitch(500); buzz([80, 40, 160]);
  spawnShards(r.left + r.width / 2, r.top + r.height / 2);
  if (out.childElementCount) addLine('err', fill(T.buyDone, { n: attempts }));
  speak(T.voice.boom);
  if (attempts % 3 === 0) { setTimeout(bsod, 900); return; }   // jeder 3. Versuch: Absturz
  setTimeout(resetBuy, 4500);
}
document.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || buyDead) return;
  const r = buy.getBoundingClientRect();
  const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
  const dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
  if (Math.hypot(dx, dy) < 40) fleeFrom(e.clientX, e.clientY);
});
buy.addEventListener('pointerdown', e => { e.preventDefault(); fleeFrom(e.clientX, e.clientY); });
buy.addEventListener('click', e => {
  e.preventDefault();
  const r = buy.getBoundingClientRect();
  fleeFrom(r.left + r.width / 2, r.top + r.height / 2);
});

    '<div class="pad"><span></span><button data-d="up">▲</button><span></span><button data-d="left">◀</button><button class="q" data-d="quit">Q</button><button data-d="right">▶</button><span></span><button data-d="down">▼</button><span></span></div>';
  out.hidden = true; promptEl.hidden = true; cmdEl.blur();
  screenEl.appendChild(box); screenEl.scrollTop = 0;
  const c = box.querySelector('canvas'), g = c.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = COLS * cell * dpr; c.height = ROWS * cell * dpr;
  c.style.width = COLS * cell + 'px'; c.style.height = ROWS * cell + 'px';
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const best = () => +(store.get('snakeBest') || 0);
  const S = { snake: [{ x: 6, y: 7 }, { x: 5, y: 7 }, { x: 4, y: 7 }], dir: { x: 1, y: 0 }, next: { x: 1, y: 0 }, food: null, score: 0, speed: 140, alive: true, timer: 0 };
  const place = () => {
    let f; do { f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) }; }
    while (S.snake.some(p => p.x === f.x && p.y === f.y));
    S.food = f;
  };
  const hud = () => {
    box.querySelector('.s').textContent = G.score + ': ' + S.score;
    box.querySelector('.h').textContent = G.best + ': ' + Math.max(best(), S.score);
  };
  const draw = () => {
    g.fillStyle = '#000a02'; g.fillRect(0, 0, COLS * cell, ROWS * cell);
    g.strokeStyle = 'rgba(0,255,65,.06)';
    for (let x = 0; x <= COLS; x++) { g.beginPath(); g.moveTo(x * cell + .5, 0); g.lineTo(x * cell + .5, ROWS * cell); g.stroke(); }
    for (let y = 0; y <= ROWS; y++) { g.beginPath(); g.moveTo(0, y * cell + .5); g.lineTo(COLS * cell, y * cell + .5); g.stroke(); }
    g.font = '800 ' + Math.floor(cell * .9) + 'px "JetBrains Mono", monospace';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#ff0055'; g.shadowColor = '#ff0055'; g.shadowBlur = 10;
    g.fillText('€', S.food.x * cell + cell / 2, S.food.y * cell + cell / 2 + 1);
    S.snake.forEach((p, i) => {
      g.fillStyle = i === 0 ? '#d6ffe0' : '#00ff41'; g.shadowColor = '#00ff41'; g.shadowBlur = i === 0 ? 12 : 6;
      g.fillRect(p.x * cell + 1, p.y * cell + 1, cell - 2, cell - 2);
    });
    g.shadowBlur = 0;
  };
  const turn = d => {
    const map = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
    const n = map[d]; if (!n) return;
    if (n.x === -S.dir.x && n.y === -S.dir.y) return;
    S.next = n;
  };
  const end = (quit) => {
    if (!S.alive) return;
    S.alive = false; clearTimeout(S.timer);
    removeEventListener('keydown', onKey, true);
    const hiScore = best(), isHigh = S.score > hiScore;
    if (S.score >= 5) { unlock('snake'); setTimeout(() => foundFrag('ER'), 1200); }
    if (S.score >= 15) unlock('snakePro');
    if (isHigh) store.set('snakeBest', S.score);
    setTimeout(() => {
      box.remove(); out.hidden = false; if (busy === 'game') busy = null; game = null;
      if (!quit) {
        addLine('err', fill(G.over, { s: S.score, h: Math.max(hiScore, S.score) }));
        if (isHigh && S.score > 0) addLine('warn', G.high);
        speak(T.voice.over);
      }
      showPrompt();
    }, quit ? 0 : 900);
    if (!quit) { sfx.err(); glitch(400); buzz([100, 60, 200]); }
  };
  const step = () => {
    if (!S.alive) return;
    S.dir = S.next;
    const h = { x: S.snake[0].x + S.dir.x, y: S.snake[0].y + S.dir.y };
    if (h.x < 0 || h.y < 0 || h.x >= COLS || h.y >= ROWS || S.snake.some(p => p.x === h.x && p.y === h.y)) { end(false); return; }
    S.snake.unshift(h);
    if (h.x === S.food.x && h.y === S.food.y) {
      S.score++; S.speed = Math.max(65, S.speed - 5); place(); sfx.eat(); buzz(20); hud();
    } else S.snake.pop();
    draw();
    S.timer = setTimeout(step, S.speed);
  };
  const onKey = e => {
    const k = e.key.toLowerCase();
    const map = { arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down', arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right' };
    if (map[k]) { turn(map[k]); e.preventDefault(); e.stopPropagation(); }
    else if (k === 'q' || k === 'escape') { end(true); e.preventDefault(); }
  };
  addEventListener('keydown', onKey, true);
  let t0 = null;
  c.addEventListener('touchstart', e => { const t = e.touches[0]; t0 = { x: t.clientX, y: t.clientY }; e.preventDefault(); }, { passive: false });
  c.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  c.addEventListener('touchend', e => {
    if (!t0) return;
    const t = e.changedTouches[0], dx = t.clientX - t0.x, dy = t.clientY - t0.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 18) turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    t0 = null;
  });
  box.querySelectorAll('.pad button').forEach(b => b.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (b.dataset.d === 'quit') end(true); else turn(b.dataset.d);
  }));
  place(); hud(); draw(); sfx.ok();
  addLine('warn', G.start);
  S.timer = setTimeout(step, 600);
  game = { end };
}

let lastShake = 0, motionAsked = false, prevAcc = null;
function onMotion(e) {
  const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
  if (prevAcc) {
    const delta = Math.abs(a.x - prevAcc.x) + Math.abs(a.y - prevAcc.y) + Math.abs(a.z - prevAcc.z);
    const now = Date.now();
    if (delta > 32 && now - lastShake > 1500 && busy !== 'bsod') {
      lastShake = now; glitch(900); unlock('shaker'); if (booted) foundFrag('NG');
      if (out.childElementCount) addLine('warn', T.shake);
    }
  }
  prevAcc = { x: a.x, y: a.y, z: a.z };
}
function enableMotion() {
  if (motionAsked || typeof DeviceMotionEvent === 'undefined') return;
  motionAsked = true;
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    // iPhone: braucht einmal Erlaubnis nach dem ersten Antippen
    DeviceMotionEvent.requestPermission().then(p => { if (p === 'granted') addEventListener('devicemotion', onMotion); }).catch(() => {});
  } else addEventListener('devicemotion', onMotion);
}
if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission !== 'function') enableMotion();
addEventListener('pointerup', () => { enableMotion(); if (soundOn && actx) audio(); });

const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];

  if (kPos === KONAMI.length) {

function confetti(n) {

  const cols = ['#ffcc00', '#ff0055', '#00ff41', '#00ffff', '#ffffff'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.setProperty('--x', (Math.random() * 200 - 100) + 'px');
    c.style.setProperty('--r', (Math.random() * 1440 - 720) + 'deg');
    c.style.animationDuration = 2.2 + Math.random() * 2.5 + 's';
    c.style.animationDelay = Math.random() * 1.2 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 6000);

}

/* ---------- Fake-Anruf ---------- */
let callDone = false, callTimer = 0;
function ringOnce() { tone(440, .45, 'sine', .07); tone(480, .45, 'sine', .07); setTimeout(() => { tone(440, .45, 'sine', .07); tone(480, .45, 'sine', .07); }, 650); }
function fakeCall(attempt = 0) {
  if (busy && busy !== 'call') { if (attempt === 0) addLine('warn', T.cmd.busy); return; }
  busy = 'call'; callDone = true; clearTimeout(callTimer); closeMenu();
  const Cl = XT.call;
  $('#call')?.remove();
  const el = document.createElement('div'); el.id = 'call';
  el.innerHTML = '<div class="av"></div><div class="nm">' + (attempt ? Cl.again[attempt - 1] : Cl.name) + '</div><div class="sub">' + Cl.sub + '</div>' +
    '<div class="st">' + Cl.ring + '</div><div class="subs"></div>' +
    '<div class="row"><button type="button" class="cb no"><i><span>📞</span></i>' + Cl.decline + '</button>' +
    '<button type="button" class="cb yes"><i>📞</i>' + Cl.accept + '</button></div>';
  document.body.appendChild(el);
  ringOnce(); buzz([500, 250, 500]);
  const ringer = setInterval(() => { ringOnce(); buzz([500, 250, 500]); }, 2600);
  const giveUp = setTimeout(() => decline(), 20000);
  const stop = () => { clearInterval(ringer); clearTimeout(giveUp); if (navigator.vibrate) navigator.vibrate(0); };
  function decline() {
    stop(); el.remove();
    if (attempt < 2) { setTimeout(() => fakeCall(attempt + 1), 2200); return; }
    busy = null; unlock('ghost'); addLine('err', Cl.missed); showPrompt();
  }
  el.querySelector('.no').addEventListener('click', () => { sfx.err(); decline(); });
  el.querySelector('.yes').addEventListener('click', async () => {
    stop(); unlock('caller');
    el.querySelector('.nm').textContent = Cl.name;
    const st = el.querySelector('.st'), subs = el.querySelector('.subs');
    el.querySelector('.row').outerHTML = '<div class="tools"><div><i>🔈</i>' + Cl.speaker + '</div><div><i>🎙️</i>' + Cl.mute + '</div><div><i>⌨️</i>' + Cl.keys +
      '</div></div><div class="row"><button type="button" class="cb no"><i><span>📞</span></i></button></div>';
    st.style.animation = 'none';
    let sec = 0; const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    st.textContent = fmt(0);
    const clock = setInterval(() => { st.textContent = fmt(++sec); }, 1000);
    let over = false;
    const hang = () => {
      if (over) return; over = true; clearInterval(clock);
      if (canSpeak) speechSynthesis.cancel();
      st.textContent = Cl.ended; [0, 220, 440].forEach(d => setTimeout(() => tone(480, .15, 'sine', .06), d));
      setTimeout(() => { el.remove(); busy = null; addLine('cyan', fill(Cl.log, { t: fmt(sec) })); showPrompt(); }, 1100);
    };
    el.querySelector('.no').addEventListener('click', hang);
    speak(Cl.script.join(' '));
    for (const line of Cl.script) {
      if (over) return;
      subs.textContent = line;
      await sleep(Math.max(2200, line.length * 75));
    }
    hang();
  });
}
function scheduleCall() {
  clearTimeout(callTimer);
  if (callDone) return;
  callTimer = setTimeout(function tryIt() {
    if (callDone) return;
    if (busy || document.hidden) { callTimer = setTimeout(tryIt, 12000); return; }
    fakeCall();
  }, 32000);
}

/* ---------- Glücksrad ---------- */
function wheel() {
  if (busy) { addLine('warn', T.cmd.busy); return; }
  busy = 'wheel';
  const Wt = XT.wheel, L = Wt.labels, N = L.length, seg = 360 / N;
  const cols = ['#ff0055', '#111', '#00ff41', '#111', '#ffcc00', '#111', '#00ffff', '#111'];
  let svg = '<svg viewBox="-100 -100 200 200">';
  for (let i = 0; i < N; i++) {
    const a0 = (i * seg - 90 - seg / 2) * Math.PI / 180, a1 = ((i + 1) * seg - 90 - seg / 2) * Math.PI / 180;
    svg += '<path d="M0 0 L' + (95 * Math.cos(a0)).toFixed(2) + ' ' + (95 * Math.sin(a0)).toFixed(2) + ' A95 95 0 0 1 ' +
      (95 * Math.cos(a1)).toFixed(2) + ' ' + (95 * Math.sin(a1)).toFixed(2) + ' Z" fill="' + cols[i] + '" stroke="#000" stroke-width="1.5"/>';
    const fg = cols[i] === '#111' ? '#fff' : '#000';
    svg += '<text transform="rotate(' + (i * seg) + ') translate(0 -58)" text-anchor="middle" dominant-baseline="middle" font-family="JetBrains Mono, monospace" font-weight="800" font-size="' +
      (L[i].length > 9 ? 7.5 : 10) + '" fill="' + fg + '">' + esc(L[i]) + '</text>';
  }
  svg += '<circle r="96" fill="none" stroke="#ffcc00" stroke-width="3"/></svg>';
  const el = document.createElement('div'); el.id = 'wheel'; el.className = 'ovl';
  el.innerHTML = '<h2>' + Wt.title + '</h2><div class="wheelwrap">' + svg + '<div class="hub">💰</div></div><div class="wres"></div>' +
    '<div class="btnrow"><button type="button" class="b sp">' + Wt.spin + '</button><button type="button" class="b alt cl">' + Wt.close + '</button></div>';
  document.body.appendChild(el);
  const svgEl = el.querySelector('svg'), res = el.querySelector('.wres'), sp = el.querySelector('.sp');
  let rot = 0, spins = 0;
  const close = () => { el.remove(); if (busy === 'wheel') busy = null; showPrompt(); };
  el.querySelector('.cl').addEventListener('click', close);
  sp.addEventListener('click', async () => {
    sp.disabled = true; res.textContent = ''; spins++; unlock('gambler');
    const cheat = spins % 3 === 1;                       // jedes 3. Mal (ab dem 1.) scheinbar Gewinn
    let target = cheat ? 2 : [0, 1, 3, 4, 5, 6, 7][Math.floor(Math.random() * 7)];
    const base = rot - (rot % 360) + 360 * 6;
    rot = base + (360 - target * seg) + (Math.random() * seg * .5 - seg * .25);
    svgEl.classList.remove('nudge'); svgEl.style.transform = 'rotate(' + rot + 'deg)';
    // Ticken, das langsamer wird
    let t = 0, d = 40;
    while (t < 5200) { setTimeout(() => tone(1500, .015, 'square', .02), t); t += d; d *= 1.07; }
    await sleep(5500);
    if (cheat) {
      res.textContent = Wt.cheat.split('…')[0] + '…'; sfx.ok();
      await sleep(1100);
      target = 1; rot += seg;                         // ruckelt noch ein Feld weiter
      svgEl.classList.add('nudge'); svgEl.style.transform = 'rotate(' + rot + 'deg)';
      sfx.err(); glitch(300);
      await sleep(1000);
      res.textContent = Wt.cheat; speak(Wt.cheat);
    } else {
      sfx.deny(); res.textContent = fill(Wt.res, { r: L[target] }); speak(L[target]);
    }
    addLine('warn', fill(Wt.log, { r: L[target] }));
    sp.textContent = Wt.again; sp.disabled = false;
  });
}

async function transfer() {
  if (busy) { addLine('warn', T.cmd.busy); return; }
  busy = 'transfer'; promptEl.hidden = true; unlock('dreamer');
  const Tr = XT.transfer, id = runId;
  const who = NAME ? up(NAME) : Tr.you;
  for (const l of Tr.lines) { await sleep(600); if (id !== runId) { busy = null; return; } addLine('warn', fill(l, { n: esc(who) })); sfx.beep(); }
  const bar = addLine('cyan', '');
  const draw = p => { const n = Math.round(p / 5); bar.textContent = Tr.bar + ' [' + '#'.repeat(n) + '-'.repeat(20 - n) + '] ' + p + ' %'; };
  for (let p = 0; p <= 99; p += Math.ceil(Math.random() * 6)) {
    if (id !== runId) { busy = null; return; }
    draw(Math.min(p, 99)); sfx.key(); await sleep(90 + Math.random() * 160);
  }
  draw(99); addLine('warn', Tr.stuck);
  for (let i = 0; i < 3; i++) { await sleep(900); sfx.beep(); }
  if (id !== runId) { busy = null; return; }
  glitch(700); sfx.deny(); addLine('err', Tr.end); speak(Tr.voice);
  busy = null; showPrompt();
}

async function shareThing({ text, url }) {
  try {
    if (navigator.share) { await navigator.share({ title: 'mescak.de', text, url }); addLine('warn', XT.share.done); unlock('friend'); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  try { await navigator.clipboard.writeText(text + ' ' + url); addLine('ok', fill(XT.share.copied, { u: esc(url) })); unlock('friend'); return true; } catch (e) {}
  addLine('ok', '<span class="c">' + esc(url) + '</span>');
  return false;
}
function shareDialog() {
  if ($('#sharebox')) return;
  const S = XT.share, el = document.createElement('div'); el.id = 'sharebox'; el.className = 'ovl';
  el.innerHTML = '<form class="panel"><h2>' + S.title + '</h2><label for="fname">' + S.label + '</label>' +
    '<input id="fname" maxlength="16" autocomplete="off" autocapitalize="words" placeholder="Ali">' +
    '<div class="btnrow"><button type="submit" class="b">' + S.go + '</button><button type="button" class="b alt cl">' + S.cancel + '</button></div></form>';
  document.body.appendChild(el);
  const inp = el.querySelector('input');
  setTimeout(() => inp.focus(), 50);
  el.querySelector('.cl').addEventListener('click', () => el.remove());
  el.querySelector('form').addEventListener('submit', async e => {
    e.preventDefault();
    const n = inp.value.replace(/[^\p{L}\p{N} .'-]/gu, '').trim().slice(0, 16);
    const url = 'https://mescak.de/?' + (n ? 'name=' + encodeURIComponent(n) + '&' : '') + 'lang=' + lang;
    el.remove();
    await shareThing({ text: S.text, url });
  });
}
$('#shareBtn').addEventListener('click', shareDialog);

/* ---------- Feiertage ---------- */
const SEASONS = ['halloween', 'xmas', 'ny', 'april'];
function seasonFor(d) {
  const m = d.getMonth() + 1, day = d.getDate();
  if ((m === 10 && day >= 15) || (m === 11 && day <= 1)) return 'halloween';
  if (m === 12 && day <= 26) return 'xmas';
  if ((m === 12 && day === 31) || (m === 1 && day === 1)) return 'ny';
  if (m === 4 && day === 1) return 'april';
  return '';
}
let SEASON = SEASONS.includes(params.get('theme')) ? params.get('theme') : seasonFor(new Date());
const FLOAT = { halloween: ['🎃', '🦇', '👻', '🕷️', '🦇'], xmas: ['❄️', '🎄', '⛄', '🎁', '❄️'], ny: ['🎆', '🥂', '✨', '🎇'], april: ['🃏', '🤡', '🎭'] };
let floatTimer = 0, fwTimer = 0;
function applySeason() {
  SEASONS.forEach(s => document.body.classList.remove('th-' + s));
  clearInterval(floatTimer); clearInterval(fwTimer);
  if (!SEASON) return;
  document.body.classList.add('th-' + SEASON);
  if (reduce) return;
  floatTimer = setInterval(() => {
    if (document.hidden) return;
    const f = document.createElement('span'); f.className = 'floater';
    f.textContent = pick(FLOAT[SEASON]);
    const ltr = Math.random() < .5, y = 10 + Math.random() * 70;
    f.style.top = y + 'vh'; f.style.left = '0';
    f.style.setProperty('--sx', ltr ? '-60px' : '105vw');
    f.style.setProperty('--ex', ltr ? '105vw' : '-60px');
    f.style.setProperty('--ey', (Math.random() * 30 - 15) + 'vh');
    f.style.setProperty('--r', (Math.random() * 60 - 30) + 'deg');
    f.style.fontSize = 22 + Math.random() * 20 + 'px';
    f.style.animationDuration = 9 + Math.random() * 7 + 's';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 17000);
  }, 3200);
  if (SEASON === 'ny') fwTimer = setInterval(() => { if (!document.hidden && !busy) spawnShards(Math.random() * innerWidth, innerHeight * (.15 + Math.random() * .4), 30, 160); }, 2600);
}
function rainColor(r, matrix) {
  if (SEASON === 'halloween') return r < .05 ? '#ffffff' : r < .25 ? '#c77dff' : '#ff7a00';
  if (SEASON === 'xmas') return r < .06 ? '#ff2a2a' : r < .16 ? '#00ff41' : '#e8f6ff';
  if (SEASON === 'ny') return r < .03 ? '#ff0055' : r < .18 ? '#ffd700' : '#00ff41';
  return r < .03 ? '#ff0055' : r < .1 ? '#d6ffe0' : (matrix && r < .2 ? '#00ffff' : '#00ff41');
}
const insultList = () => SEASON ? [XT.season[SEASON][0], ...T.insults] : T.insults;
applySeason();

/* =====================================================================
   START · BOOT · NEUSTART
   ===================================================================== */
let booted = false, started = false, bootRun = 0;
const boot = $('#boot'), gate = $('#gate');

// Finger-Video: sofort starten und bei jeder Gelegenheit wieder anschubsen
// (iPhone im Stromsparmodus / Hintergrund hält Autoplay sonst an)
const vid = document.querySelector('video');
function playVideo() { if (vid.paused) { const p = vid.play(); if (p) p.catch(() => {}); } }
playVideo();
vid.addEventListener('canplay', playVideo);
document.addEventListener('visibilitychange', () => { if (!document.hidden) playVideo(); });
['pointerdown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, playVideo, { passive: true }));

function finishBoot() {
  if (booted) return;
  booted = true; bootRun++;
  boot.classList.add('gone');
  document.body.classList.remove('on', 'crumble'); void document.body.offsetWidth;
  document.body.classList.add('on');
  setTimeout(() => { if (booted) boot.hidden = true; }, 500);
  playVideo();
  runIntro();
  scheduleSelfDestruct();
  scheduleCall();
  if (SEASON === 'april' && !reduce) { const m = $('main'); setTimeout(() => m.classList.add('flip'), 1500); setTimeout(() => m.classList.remove('flip'), 4500); }
}
async function runBoot() {
  const id = ++bootRun;
  booted = false;
  runId++;                                   // laufendes Terminal abbrechen
  out.innerHTML = ''; promptEl.hidden = true;
  if (reduce) { finishBoot(); return; }
  const log = $('#bootlog'), bar = $('#bootfill');
  log.innerHTML = ''; bar.style.width = '0';
  boot.classList.remove('gone'); boot.hidden = false;
  const lines = T.boot.slice();
  if (NAME) lines.splice(lines.length - 2, 0, fill(T.bootName, { n: esc(up(NAME)) }));
  if (SEASON) lines.splice(1, 0, XT.season[SEASON][1]);
  for (let i = 0; i < lines.length; i++) {
    if (id !== bootRun) return;
    const line = document.createElement('div');
    line.innerHTML = lines[i];
    log.appendChild(line);
    bar.style.width = Math.round((i + 1) / lines.length * 100) + '%';
    if (i === lines.length - 1) { sfx.deny(); buzz([60, 40, 60]); speak(fill(T.voice.deny, { n: nameVoice() })); }
    else sfx.beep();
    await sleep(i === 0 ? 450 : i === lines.length - 2 ? 520 : 330);
  }
  await sleep(1100);
  if (id === bootRun) finishBoot();
}
boot.addEventListener('pointerdown', finishBoot);
addEventListener('keydown', e => { if (started && !booted && e.key !== 'Tab') finishBoot(); });

function closeAll() {
  if (game) game.end(true);
  if (busy === 'cam') closeCam();
  const cd = $('#cd'); if (cd) cd.remove();
  ['#call', '#wheel', '#finale', '#sharebox'].forEach(q => $(q)?.remove());
  if (['cd', 'call', 'wheel', 'finale', 'transfer'].includes(busy)) busy = null;
  closeMenu();
}
// alles von vorne (Sprachwechsel, Neustart, nach Absturz/Zerstörung)
function restart() {
  closeAll();
  document.body.classList.remove('matrix', 'glitch', 'soft', 'crumble');
  resetBuy();
  glitch(300);
  runBoot();
}

// Start-Knopf: der eine Tipp schaltet Ton, Sprache, Video und Schüttel-Sensor frei
function start() {
  if (started) return;
  started = true;
  if (soundOn) {
    audio(); sfx.ok();
    if (canSpeak) { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }
  }
  enableMotion();
  playVideo();
  unlock('welcome');
  if (new Date().getHours() < 5) setTimeout(() => unlock('nightowl'), 4500);
  gate.classList.add('gone');
  setTimeout(() => gate.remove(), 450);
  runBoot();
}
$('#go').addEventListener('click', start);
addEventListener('keydown', e => { if (!started && e.key === 'Enter' && document.activeElement?.dataset?.lang == null) { e.preventDefault(); start(); } });

setLang(lang, false);
if (params.has('skip')) {   // nur zum Testen: ohne Startbildschirm und Boot
  started = true; gate.remove(); finishBoot();
} else $('#go').focus({ preventScroll: true });
</script>

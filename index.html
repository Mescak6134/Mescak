    #bootlog {
      width: min(620px, 100%); margin: 0 auto;
      font: inherit; font-size: clamp(0.72rem, 3vw, 0.9rem); line-height: 1.7;
      white-space: pre-wrap; overflow-wrap: anywhere;

    .bootbar { width: min(620px, 100%); margin: 1rem auto 0; height: 6px; border: 1px solid var(--green-dim); }

      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;

    @keyframes barsMove { 0% { background-position: 0 0; } 100% { background-position: 0 37px; } }
    @keyframes jitter {

  if (!actx) {
    const C = window.AudioContext || window.webkitAudioContext;

}
function tone(f, d = .06, type = 'square', vol = .04, slide) {
  if (!soundOn) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d = .25, vol = .1, freq = 1200, toFreq) {
  if (!soundOn) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime, len = Math.floor(a.sampleRate * d);
  const buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), flt = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; flt.type = 'bandpass'; flt.Q.value = 1.2;
  flt.frequency.setValueAtTime(freq, t);
  if (toFreq) flt.frequency.exponentialRampToValueAtTime(toFreq, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  src.connect(flt).connect(g).connect(a.destination); src.start(t);
}

const cv = $('#rain'), ctx = cv.getContext('2d');
const CHARS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜĞŞİÇ$#%&*+<>/\\=';
const FS = 16;
let W = 0, H = 0, cols = [];
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const n = Math.ceil(W / FS);
  cols = Array.from({ length: n }, (_, i) => cols[i] ?? Math.random() * -H / FS);
}
resize(); addEventListener('resize', resize);
let last = 0;
function rain(ts) {
  requestAnimationFrame(rain);
  if (ts - last < 50) return;   // ~20 Bilder/s reichen und schonen den Akku (im Hintergrund pausiert der Browser ohnehin)
  last = ts;
  const matrix = document.body.classList.contains('matrix');
  ctx.fillStyle = 'rgba(0,0,0,0.07)'; ctx.fillRect(0, 0, W, H);
  ctx.font = '700 ' + FS + 'px "JetBrains Mono", monospace';
  for (let i = 0; i < cols.length; i++) {
    const y = cols[i] * FS;
    const ch = CHARS[Math.floor(Math.random() * CHARS.length)];
    const r = Math.random();
    ctx.fillStyle = r < .03 ? '#ff0055' : r < .1 ? '#d6ffe0' : (matrix && r < .2 ? '#00ffff' : '#00ff41');
    ctx.fillText(ch, i * FS, y);
    if (y > H && Math.random() > (matrix ? .9 : .975)) cols[i] = 0;
    cols[i] += matrix ? 1 : .55;
  }
}
if (reduce) {
  ctx.font = '700 ' + FS + 'px monospace'; ctx.fillStyle = 'rgba(0,255,65,.4)';
  for (let i = 0; i < 400; i++) ctx.fillText(CHARS[i % CHARS.length], Math.random() * W, Math.random() * H);
} else requestAnimationFrame(rain);

function deviceName() {
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua)) return 'iPhone';
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'iPad';
  if (/Android/.test(ua)) {
    const m = ua.match(/Android [\d.]+; ([^;)]+)/);
    const model = m && m[1].trim();
    return 'Android' + (model && model !== 'K' ? ' · ' + model : '');
  }
  if (/Windows/.test(ua)) return 'Windows-PC';
  if (/Mac/.test(ua)) return 'Mac';
  if (/CrOS/.test(ua)) return 'Chromebook';
  if (/Linux/.test(ua)) return 'Linux';
  return '???';
}
function browserName() {
  const ua = navigator.userAgent;
  if (navigator.brave) return 'Brave';
  if (/Edg(e|A|iOS)?\//.test(ua)) return 'Edge';
  if (/OPR\/|Opera/.test(ua)) return 'Opera';
  if (/SamsungBrowser/.test(ua)) return 'Samsung Internet';
  if (/Firefox|FxiOS/.test(ua)) return 'Firefox';
  if (/CriOS|Chrome/.test(ua)) return 'Chrome';
  if (/Safari/.test(ua)) return 'Safari';
  return '???';
}
const DEVICE = deviceName(), BROWSER = browserName();
let battery = null;
const batteryReady = (navigator.getBattery
  ? Promise.race([navigator.getBattery().then(b => { battery = b; }).catch(() => {}), sleep(900)])
  : Promise.resolve());

function scanLines() {
  const s = T.scan, tag = '<span class="c">' + s.tag + '</span> ';
  const now = new Date();
  const time = now.toLocaleTimeString(lang === 'en' ? 'en-GB' : lang, { hour: '2-digit', minute: '2-digit' });
  let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
  const L = [
    ['cyan', tag + s.device + ': <span class="w">' + esc(DEVICE) + '</span> · ' + s.browser + ': <span class="w">' + esc(BROWSER) + '</span>'],
    ['cyan', tag + s.time + ': <span class="w">' + time + '</span>' + (tz ? ' <span class="dim">(' + esc(tz) + ')</span>' : '')],
    ['cyan', tag + s.screen + ': <span class="w">' + screen.width + '×' + screen.height + '</span> · ' + s.lang + ': <span class="w">' + esc(navigator.language || '?') + '</span>']
  ];
  if (battery) {
    L.push(['cyan', tag + s.battery + ': <span class="' + (battery.level < .2 ? 'r' : 'w') + '">' + Math.round(battery.level * 100) + ' %</span>' + (battery.charging ? ' (' + s.charging + ')' : '')]);
  }
  L.push(['cyan', s.done], ['cyan', s.bye]);
  return L;
}

const out = $('#out'), screenEl = $('#screen'), promptEl = $('#prompt'), cmdEl = $('#cmd');
const cursor = document.createElement('span'); cursor.className = 'cursor';
let runId = 0;
const toBottom = () => { screenEl.scrollTop = screenEl.scrollHeight; };

function addLine(cls, html) {
  const d = document.createElement('div');
  d.className = 'tline ' + (cls || 'ok');
  d.innerHTML = html;
  out.appendChild(d); toBottom();
  return d;
}
async function typeLine(cls, html, id, speed = 1) {
  const d = addLine(cls, '');
  if (reduce) { d.innerHTML = html; return id === runId; }
  const tokens = html.match(/<[^>]+>|&[a-z#0-9]+;|[\s\S]/gu) || [];
  let built = '', n = 0;
  for (let i = 0; i < tokens.length; i++) {
    if (id !== runId) return false;
    built += tokens[i];
    if (tokens[i][0] === '<') continue;
    d.innerHTML = built; d.appendChild(cursor); toBottom();
    if (++n % 2 === 0) sfx.key();
    await sleep((12 + Math.random() * 20) / speed);
  }
  d.innerHTML = built;
  return id === runId;
}
async function runIntro() {
  const id = ++runId;
  out.innerHTML = ''; promptEl.hidden = true;
  await sleep(350);
  for (const [cls, html] of T.lines) {
    if (!await typeLine(cls, html, id)) return;
    await sleep(200);
  }
  await batteryReady;
  for (const [cls, html] of scanLines()) {
    if (id !== runId) return;
    if (!await typeLine(cls, html, id, 1.6)) return;
    await sleep(140);
  }
  if (id !== runId) return;
  sfx.beep();
  promptEl.hidden = false;
  cmdEl.placeholder = T.placeholder;
  toBottom();
}

  const C = T.cmd, input = raw.trim(), low = input.toLocaleLowerCase('tr').replace(/İ/g, 'i');
  const [w0, ...rest] = low.split(/\s+/); const arg = rest.join(' ');
  addLine('dim', '<span class="c">root@mescak.de:~$</span> ' + esc(input));
  if (!input) return;
  const say = (h, cls = 'ok') => addLine(cls, h);
  const id = runId;

  switch (true) {
    case ['help', 'hilfe', 'yardım', 'yardim', '?', 'man'].includes(w0):
      C.help.forEach(l => say(l)); break;
    case ['whoami', 'kimim', 'wer'].includes(w0):
      say(fill(C.whoami, { device: '<span class="w">' + esc(DEVICE) + '</span>' })); break;
    case ['kaufen', 'buy', 'purchase', 'preis', 'price', 'fiyat'].includes(w0) || /^satın|^satin/.test(low):
      sfx.deny(); glitch(400); C.buy.forEach(l => say(l, 'err')); break;
    case w0 === 'ls' || w0 === 'dir':
      say(C.ls); break;
    case w0 === 'cat' || w0 === 'type' || w0 === 'less' || w0 === 'more':
      if (/geheim|gizli|secret/.test(arg)) say(C.secret, 'warn');
      else if (/pass|şifre|sifre/.test(arg)) { say(C.pw, 'warn'); }
      else { sfx.err(); say(fill(C.nofile, { f: esc(arg || '?') }), 'err'); }
      break;
    case w0 === 'cd':
      sfx.err(); say(C.cd, 'err'); break;
    case w0 === 'sudo' || w0 === 'su' || w0 === 'admin' || w0 === 'root':
      sfx.err(); glitch(300); say(fill(C.sudo, { u: esc(DEVICE.split(' ')[0].toLowerCase()) }), 'err'); break;
    case w0 === 'rm' || w0 === 'del' || w0 === 'format':
      glitch(1200); say(C.rm, 'err'); break;
    case w0 === 'hack' || w0 === 'hacker' || w0 === 'nmap' || w0 === 'ssh':
      promptEl.hidden = true;
      for (let i = 0; i < C.hack.length; i++) {
        await sleep(i ? 650 : 150);
        if (id !== runId) return;
        if (i === C.hack.length - 1) { glitch(700); sfx.err(); }
        else sfx.beep();
        say(C.hack[i], i === C.hack.length - 1 ? 'err' : 'warn');
      }
      promptEl.hidden = false; cmdEl.focus({ preventScroll: true });
      break;
    case w0 === 'matrix' || w0 === 'neo':
      document.body.classList.add('matrix'); sfx.whoosh();
      say(C.matrix, 'ok');
      setTimeout(() => document.body.classList.remove('matrix'), 9000); break;
    case w0 === 'glitch' || w0 === 'bug':
      glitch(1000); say(C.glitch, 'err'); break;
    case w0 === 'ping':
      say(C.ping); break;
    case ['date', 'datum', 'tarih', 'time', 'zeit', 'saat'].includes(w0):
      say(new Date().toLocaleString(lang === 'en' ? 'en-GB' : lang)); break;
    case w0 === 'echo':
      say(esc(input.slice(5)) || '…'); break;
    case ['clear', 'cls', 'temizle'].includes(w0):
      out.innerHTML = ''; break;
    case ['sound', 'ton', 'ses', 'mute'].includes(w0):
      setSound(w0 === 'mute' ? false : !soundOn); say(soundOn ? C.soundOn : C.soundOff); break;
    case ['lang', 'sprache', 'dil', 'language'].includes(w0):
      if (TEXT[arg]) { setLang(arg, true); return; }
      say(C.lang, 'warn'); break;
    case ['privacy', 'datenschutz', 'gizlilik'].includes(w0):
      say(C.privacy, 'cyan'); break;
    case ['exit', 'quit', 'logout', 'bye', 'tschüss', 'çıkış', 'cikis'].includes(w0):
      say(C.exit, 'warn'); break;
    case ['hallo', 'hello', 'hi', 'hey', 'merhaba', 'selam', 'moin', 'servus'].includes(w0):
      say(C.hello, 'err'); break;
    default:
      sfx.err(); say(fill(C.unknown, { c: esc(input.slice(0, 40)) }), 'err');
  }
  toBottom();
}
promptEl.addEventListener('submit', e => {
  e.preventDefault();
  const v = cmdEl.value; cmdEl.value = '';
  if (v.trim()) { history.push(v); hIdx = history.length; }
  runCmd(v);
});
cmdEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' && history.length) { hIdx = Math.max(0, hIdx - 1); cmdEl.value = history[hIdx]; e.preventDefault(); }
  else if (e.key === 'ArrowDown') { hIdx = Math.min(history.length, hIdx + 1); cmdEl.value = history[hIdx] || ''; e.preventDefault(); }
  else if (e.key.length === 1) sfx.key();
});
$('#term').addEventListener('click', () => { if (!promptEl.hidden && !getSelection().toString()) cmdEl.focus({ preventScroll: true }); });

/* =====================================================================
   WECHSELNDE SPRÜCHE
   ===================================================================== */
let ii = 0;
const insEl = $('#ins');
const showInsult = () => { insEl.innerHTML = T.insults[ii] + ' <span class="blink">_</span>'; };
setInterval(() => {
  if (reduce) { ii = (ii + 1) % T.insults.length; showInsult(); return; }
  insEl.classList.add('out');
  setTimeout(() => { ii = (ii + 1) % T.insults.length; showInsult(); insEl.classList.remove('out'); }, 300);
}, 2800);

/* =====================================================================
   WEGLAUFENDER KAUF-KNOPF
   ===================================================================== */
const buy = $('#buy'), slot = buy.parentElement;
let flees = 0, attempts = 0, lastFlee = 0, buyDead = false;
const MAX_FLEES = 7;

function fleeFrom(px, py) {
  if (buyDead) return;
  const now = performance.now();
  if (now - lastFlee < 120) return;
  lastFlee = now;
  const r = buy.getBoundingClientRect();
  if (!buy.classList.contains('free')) {
    buy.style.left = r.left + 'px'; buy.style.top = r.top + 'px';
    buy.classList.add('free');
    slot.style.width = r.width + 'px';
    void buy.offsetWidth;
  }
  flees++;
  if (flees >= MAX_FLEES) { explode(); return; }
  buy.textContent = T.buy[flees % T.buy.length];
  const bw = buy.offsetWidth, bh = buy.offsetHeight, m = 16, topMin = 70;
  let x, y, tries = 0;
  do {
    x = m + Math.random() * Math.max(1, innerWidth - bw - 2 * m);
    y = topMin + Math.random() * Math.max(1, innerHeight - bh - topMin - m);
    tries++;
  } while (tries < 20 && Math.hypot(x + bw / 2 - px, y + bh / 2 - py) < Math.min(260, innerWidth * .45));
  buy.style.left = x + 'px'; buy.style.top = y + 'px';
  sfx.whoosh();
  if (navigator.vibrate) navigator.vibrate(15);
}
function explode() {
  buyDead = true; attempts++;
  const r = buy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  buy.classList.add('boom'); sfx.boom(); glitch(500);
  if (navigator.vibrate) navigator.vibrate([80, 40, 160]);
  if (!reduce) for (let i = 0; i < 26; i++) {
    const s = document.createElement('i'); s.className = 'shard';
    const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 220;
    s.style.left = cx + 'px'; s.style.top = cy + 'px';
    s.style.setProperty('--dx', Math.cos(a) * d + 'px');
    s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    s.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    if (i % 3 === 0) s.style.background = 'var(--cyan)';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
  if (!promptEl.hidden || out.childElementCount) addLine('err', fill(T.buyDone, { n: attempts }));
  // nach ein paar Sekunden steht er wieder brav an seinem Platz
  setTimeout(() => {
    buy.classList.remove('free', 'boom');
    buy.style.left = buy.style.top = ''; slot.style.width = '';
    flees = 0; buyDead = false; buy.textContent = T.buy[0];
  }, 4500);
}
// Maus kommt zu nah → weg
document.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || buyDead) return;
  const r = buy.getBoundingClientRect();
  const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
  const dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
  if (Math.hypot(dx, dy) < 40) fleeFrom(e.clientX, e.clientY);
});
// Finger/Klick/Tastatur → weg
buy.addEventListener('pointerdown', e => { e.preventDefault(); fleeFrom(e.clientX, e.clientY); });
buy.addEventListener('click', e => {
  e.preventDefault();
  const r = buy.getBoundingClientRect();
  fleeFrom(r.left + r.width / 2, r.top + r.height / 2);
});

/* =====================================================================
   HANDY SCHÜTTELN  ·  KONAMI-CODE
   ===================================================================== */
let lastShake = 0, motionAsked = false, prevAcc = null;
function onMotion(e) {
  const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
  if (prevAcc) {
    const delta = Math.abs(a.x - prevAcc.x) + Math.abs(a.y - prevAcc.y) + Math.abs(a.z - prevAcc.z);
    const now = Date.now();
    if (delta > 32 && now - lastShake > 1500) {
      lastShake = now; glitch(900);
      if (out.childElementCount) addLine('warn', T.shake);
    }
  }
  prevAcc = { x: a.x, y: a.y, z: a.z };
}
function enableMotion() {
  if (motionAsked || typeof DeviceMotionEvent === 'undefined') return;
  motionAsked = true;
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    // iPhone: braucht einmal Erlaubnis nach dem ersten Antippen
    DeviceMotionEvent.requestPermission().then(p => { if (p === 'granted') addEventListener('devicemotion', onMotion); }).catch(() => {});
  } else addEventListener('devicemotion', onMotion);
}
if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission !== 'function') enableMotion();
addEventListener('pointerup', () => { enableMotion(); if (soundOn) audio(); }, { once: false });

const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let kPos = 0;
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  kPos = (k === KONAMI[kPos]) ? kPos + 1 : (k === KONAMI[0] ? 1 : 0);
  if (kPos === KONAMI.length) {
    kPos = 0; glitch(1500);
    document.body.classList.add('matrix'); setTimeout(() => document.body.classList.remove('matrix'), 6000);
    addLine('warn', T.konami);
  }
});

/* =====================================================================
   SPRACHE ANWENDEN
   ===================================================================== */
function setLang(l, save) {
  lang = l; T = TEXT[l];
  document.documentElement.lang = l;
  document.title = T.title + ' · mescak.de';
  const title = $('#title'); title.textContent = T.title; title.dataset.text = T.title;
  $('#status').textContent = T.status;
  $('#hint').innerHTML = T.hint;
  $('#skip').textContent = T.skip;
  if (!buyDead) buy.textContent = T.buy[flees % T.buy.length];
  ii = 0; showInsult();
  renderSound();
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  if (save) store.set('lang', l);
  if (booted) runIntro();
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { if (lang !== b.dataset.lang) { setLang(b.dataset.lang, true); glitch(250); } }));

/* =====================================================================
   BOOT-SEQUENZ
   ===================================================================== */
let booted = false;
const boot = $('#boot');
function finishBoot() {
  if (booted) return;
  booted = true;
  boot.classList.add('gone');
  document.body.classList.add('on');
  setTimeout(() => boot.remove(), 500);
  playVideo();
  runIntro();
}
// manche Browser halten Autoplay an (Stromsparen, Hintergrund) → wieder anschubsen
const vid = document.querySelector('video');
function playVideo() { if (vid.paused) { const p = vid.play(); if (p) p.catch(() => {}); } }
document.addEventListener('visibilitychange', () => { if (!document.hidden) playVideo(); });
addEventListener('pointerup', playVideo);
async function runBoot() {
  if (reduce || new URLSearchParams(location.search).has('skip')) { boot.remove(); booted = true; runIntro(); return; }
  const log = $('#bootlog'), bar = $('#bootfill');
  for (let i = 0; i < T.boot.length; i++) {
    if (booted) return;
    const line = document.createElement('div');
    line.innerHTML = T.boot[i];
    log.appendChild(line);
    bar.style.width = Math.round((i + 1) / T.boot.length * 100) + '%';
    if (i === T.boot.length - 1) { sfx.deny(); if (navigator.vibrate) navigator.vibrate([60, 40, 60]); }
    else sfx.beep();
    await sleep(i === 0 ? 450 : i === T.boot.length - 2 ? 520 : 330);
  }
  await sleep(900);
  finishBoot();
}
boot.addEventListener('pointerdown', finishBoot);
addEventListener('keydown', e => { if (!booted && e.key !== 'Tab') finishBoot(); });

setLang(lang, false);
runBoot();
</script>
